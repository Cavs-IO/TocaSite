<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toca</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252936;
        }

        .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 28px;
    font-weight: bold;
}

.logo img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    border-radius: 8px;
}

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        main {
            padding: 100px 8%;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .button {
            padding: 14px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            background: #5865f2;
            color: white;
        }

        .button.secondary {
            background: #252936;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #252936;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
    <img src="logo.png" alt="Toca">
    <span>Toca</span>
</div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Economia</a>
            <a href="#">Ranking</a>
        </nav>
    </header>

    <main>
        <h1>Bem-vindo à Toca</h1>

        <p class="subtitle">
            O site oficial da Toca.
        </p>

        <div class="buttons">
            <button class="button" onclick="loginDiscord()">
    Entrar com Discord
</button>

            <a href="#" class="button secondary">
                Ver Ranking
            </a>
        </div>
    </main>

    <footer>
        Toca © 2026
    </footer>
<script>
    const DISCORD_CLIENT_ID = "1538432802750464031";

    function loginDiscord() {
        const redirectUri = "https://cavs-io.github.io/TocaSite/";

        const url =
            "https://discord.com/oauth2/authorize" +
            "?client_id=" + DISCORD_CLIENT_ID +
            "&response_type=code" +
            "&redirect_uri=" + encodeURIComponent(redirectUri) +
            "&scope=identify";

        window.location.href = url;
    }
</script>
</body>
</html>
