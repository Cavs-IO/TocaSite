<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toca</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252936;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        main {
            padding: 100px 8%;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .button {
            padding: 14px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            background: #5865f2;
            color: white;
        }

        .button.secondary {
            background: #252936;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #252936;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Toca</div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Economia</a>
            <a href="#">Ranking</a>
        </nav>
    </header>

    <main>
        <h1>Bem-vindo à Toca</h1>

        <p class="subtitle">
            O site oficial da Toca.
        </p>

        <div class="buttons">
            <a href="#" class="button">
                Entrar com Discord
            </a>

            <a href="#" class="button secondary">
                Ver Ranking
            </a>
        </div>
    </main>

    <footer>
        Toca © 2026
    </footer>

</body>
</html>
